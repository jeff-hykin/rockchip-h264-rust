[package]
name = "rockchip-h264"
version = "0.2.0"
edition = "2021"
description = "Pure-Rust MJPEG -> H.264 on the Rockchip RK3588: the hardware JPEG decoder and VEPU580 H.264 encoder driven straight through /dev/mpp_service, no MPP library"
license = "Apache-2.0"
repository = "https://github.com/jeff-hykin/rockchip-h264-rust"
readme = "README.md"
keywords = ["rockchip", "rk3588", "h264", "mjpeg", "encoder"]
categories = ["multimedia::video", "hardware-support", "os::linux-apis"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
libc = "0.2"
anyhow = "1"

[profile.release]
debug = 1
